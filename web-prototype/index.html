<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiBrowser - Mobile Emulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <h1>MultiBrowser</h1>
      <span class="subtitle">Side-by-side mobile webapp testing</span>
    </div>

    <div class="controls">
      <div class="control-group url-group">
        <label for="urlInput">URL</label>
        <input id="urlInput" type="text" placeholder="https://example.com or http://localhost:3000" spellcheck="false">
      </div>

      <div class="control-group">
        <label for="deviceSelect">Device</label>
        <select id="deviceSelect"></select>
      </div>

      <div class="control-group custom-size" id="customSizeGroup">
        <label>Custom (W×H)</label>
        <div class="inline-inputs">
          <input id="customWidth" type="number" min="200" max="2000" value="390" aria-label="Custom width">
          <span>×</span>
          <input id="customHeight" type="number" min="200" max="3000" value="844" aria-label="Custom height">
        </div>
      </div>

      <div class="control-group">
        <label for="orientationSelect">Orientation</label>
        <select id="orientationSelect">
          <option value="portrait">Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </div>

      <div class="control-group">
        <label for="scaleSelect">Zoom</label>
        <select id="scaleSelect">
          <option value="0.25">25%</option>
          <option value="0.33">33%</option>
          <option value="0.5" selected>50%</option>
          <option value="0.67">67%</option>
          <option value="0.75">75%</option>
          <option value="1">100%</option>
        </select>
      </div>

      <div class="control-group actions">
        <label>&nbsp;</label>
        <button id="addPanelBtn" class="primary">Add panel</button>
      </div>
    </div>
  </header>

  <div class="notice" id="notice">
    <strong>Note:</strong> Some sites block embedding in iframes (X-Frame-Options / CSP). Local dev servers and iframe-friendly sites work best.
    <button id="dismissNotice" class="icon-btn" title="Dismiss" aria-label="Dismiss notice">×</button>
  </div>

  <main class="workspace" id="workspace" aria-label="Device panels">
    <div class="empty-state" id="emptyState">
      <h2>No panels yet</h2>
      <p>Enter a URL, choose a device size, and click <strong>Add panel</strong> to open a side-by-side view.</p>
    </div>
  </main>

  <template id="panelTemplate">
    <section class="panel">
      <div class="panel-header">
        <div class="panel-meta">
          <div class="panel-title"></div>
          <div class="panel-subtitle"></div>
        </div>
        <div class="panel-actions">
          <button class="icon-btn rotate-btn" title="Rotate" aria-label="Rotate">⟳</button>
          <button class="icon-btn reload-btn" title="Reload" aria-label="Reload">↻</button>
          <button class="icon-btn close-btn danger" title="Close panel" aria-label="Close panel">×</button>
        </div>
      </div>
      <div class="panel-urlbar">
        <input type="text" class="panel-url" spellcheck="false" aria-label="Panel URL">
        <button class="go-btn">Go</button>
      </div>
      <div class="device-stage">
        <div class="device-frame">
          <iframe class="device-screen" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads"></iframe>
        </div>
      </div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
